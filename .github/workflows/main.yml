
name: Build and Deploy Micro-S4

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código desde GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Iniciar sesión en Docker Hub
      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Construir la imagen Docker
      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/my-app:latest .

      # 4. Publicar la imagen en Docker Hub
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/my-app:latest

      # 5. Configurar la clave SSH para EC2
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      # 6. Desplegar el microservicio en EC2
      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            ${{ secrets.USER_SERVER }}@${{ secrets.EC2_HOST }} << 'EOF'

            set -e

            # Autenticarse en Docker Hub
            echo '${{ secrets.DOCKERHUB_TOKEN }}' | docker login \
              -u '${{ secrets.DOCKERHUB_USERNAME }}' \
              --password-stdin

            # Descargar la imagen actualizada
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/my-app:latest

            # Detener el contenedor anterior
            docker stop my-app || true
            docker rm my-app || true

            # Ejecutar el microservicio con Spring Security y S3
            docker run -d \
              --name my-app \
              --restart unless-stopped \
              -p 8080:8080 \
              -e AZURE_ISSUER_URI='${{ secrets.AZURE_ISSUER_URI }}' \
              -e AWS_ACCESS_KEY_ID='${{ secrets.AWS_ACCESS_KEY_ID }}' \
              -e AWS_SECRET_ACCESS_KEY='${{ secrets.AWS_SECRET_ACCESS_KEY }}' \
              -e AWS_SESSION_TOKEN='${{ secrets.AWS_SESSION_TOKEN }}' \
              -e AWS_REGION='us-east-1' \
              ${{ secrets.DOCKERHUB_USERNAME }}/my-app:latest

            # Comprobar el estado del contenedor
            docker ps

          EOF
